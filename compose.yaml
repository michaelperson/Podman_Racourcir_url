# Raccourcisseur d'URL : application + MongoDB.
#
# Prérequis (une seule fois) : créer le fichier du secret, hors dépôt.
#   mkdir -p secrets
#   openssl rand -base64 24 > secrets/mongo_password.txt   (ou tout autre mot de passe)
#   chmod 644 secrets/mongo_password.txt   # lisible par l'utilisateur non-root du conteneur
#
# Lancement :  podman compose up -d --build
# Arrêt     :  podman compose down        (les données restent dans le volume)

name: raccourcisseur

services:
  mongo:
    image: docker.io/library/mongo:8.0.38
    environment:
      MONGO_INITDB_ROOT_USERNAME: raccourcisseur
      # Le mot de passe est lu dans le fichier du secret, jamais écrit ici.
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongo-data:/data/db
    # Pas de « ports: » : la base n'est joignable que par l'application, sur le réseau du projet.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/raccourcisseur-url:1.0.0
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      MONGO_HOST: mongo
      MONGO_USER: raccourcisseur
      MONGO_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    ports:
      - "8080:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Durcissement : système de fichiers en lecture seule, aucune capability,
    # pas d'élévation de privilèges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mongo-data:

secrets:
  mongo_password:
    file: ./secrets/mongo_password.txt
