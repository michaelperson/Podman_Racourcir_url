# Construit l'image avec Podman, la scanne avec Trivy (version épinglée),
# puis la publie sur ghcr.io (uniquement depuis main ou un tag v*).
name: Build, scan et publication

on:
  push:
    branches: [main, solutions]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Moindre privilège : lecture du dépôt, écriture des packages (ghcr.io) seulement.
permissions:
  contents: read
  packages: write

env:
  # Version de Trivy épinglée et vérifiée. Jamais 0.69.4, 0.69.5 ni 0.69.6
  # (versions compromises en mars 2026), jamais « latest ».
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.2

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      # Action épinglée par SHA de commit (un tag peut être déplacé, un SHA non).
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calculer le nom et le tag de l'image
        run: |
          # ghcr.io exige un nom en minuscules
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/raccourcisseur-url" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Construire l'image (Podman)
        run: podman build -f Containerfile -t "$IMAGE:$TAG" .

      - name: Scanner l'image avec Trivy
        run: |
          podman save -o image.tar "$IMAGE:$TAG"
          # Échec du job si une vulnérabilité CRITIQUE corrigeable est trouvée
          podman run --rm -v "$PWD/image.tar:/image.tar:ro" "$TRIVY_IMAGE" \
            image --input /image.tar --severity CRITICAL --ignore-unfixed --exit-code 1

      - name: Publier sur ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push "$IMAGE:$TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            podman tag "$IMAGE:$TAG" "$IMAGE:${GITHUB_REF_NAME#v}"
            podman push "$IMAGE:${GITHUB_REF_NAME#v}"
          fi
